services:
  background-removal:
    image: cjnet/photodesk-rembg:local
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:7000:7000"
    volumes:
      - rembg-models:/models
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 3g
          pids: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  rembg-models:
